# Ingestion des sources (Code du travail et conventions, révisions épinglées) : Job lancé par
# deploy/local.sh ingere, hors de la kustomisation (une ingestion n'est pas un état à maintenir).
apiVersion: batch/v1
kind: Job
metadata:
  name: ingestion
  namespace: droits
  labels:
    app.kubernetes.io/part-of: droits-salaries
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion
    spec:
      restartPolicy: Never
      # Attend Postgres (premier démarrage : initialisation de la base) plutôt que d'échouer et redémarrer
      initContainers:
        - name: attente-postgres
          image: postgres:18.6
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U droits; do sleep 2; done"]
          resources:
            limits:
              memory: 64Mi
      containers:
        - name: ingestion
          image: social:local
          imagePullPolicy: Never
          args:
            - --droits.ingestion.run=true
            - --spring.main.web-application-type=none
            - --droits.ingestion.cache-dir=/cache
          envFrom:
            - configMapRef:
                name: social
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: mot-de-passe
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir: {}
