# Postgres, une instance, données sur un volume local-path (provisionneur de k3s).
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          # PostgreSQL 18 avec l'extension pgvector (recherche sémantique), version épinglée ; les
          # tests utilisent pgvector/pgvector:pg18
          image: pgvector/pgvector:0.8.7-pg18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: droits
            - name: POSTGRES_USER
              value: droits
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: mot-de-passe
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "droits", "-d", "droits"]
            periodSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            # Postgres 18 range ses données dans un sous-dossier versionné de /var/lib/postgresql
            - name: donnees
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
