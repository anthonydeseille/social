# Pile d'observabilité locale tout-en-un (grafana/otel-lgtm : collecteur OpenTelemetry, Prometheus,
# Tempo, Loki et Grafana) : reçoit les traces et métriques de l'application en OTLP (port 4318) et
# les affiche dans Grafana (http://localhost:3000 sur le Mac). Tableau de bord et alertes
# provisionnés depuis deploy/k8s/observabilite/. Données en mémoire : perdues au redémarrage.
apiVersion: v1
kind: Service
metadata:
  name: observabilite
spec:
  # Grafana publié sur le port 3000 du Mac par le load balancer de k3d (deploy/k3d/cluster.yaml) ;
  # le port OTLP n'est utile qu'à l'application, dans le cluster
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: observabilite
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observabilite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observabilite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observabilite
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.41.1
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-http
              containerPort: 4318
          env:
            # Accès sans compte en lecture seule (admin/admin pour modifier) : cluster local uniquement
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/questions.json
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
          resources:
            requests:
              memory: 768Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: tableaux-de-bord
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/questions.json
              subPath: questions.json
            - name: tableaux-de-bord
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml
              subPath: tableaux.yaml
            - name: tableaux-de-bord
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting/alertes.yaml
              subPath: alertes.yaml
      volumes:
        - name: tableaux-de-bord
          configMap:
            name: observabilite
