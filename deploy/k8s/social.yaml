# L'application (API et page web). L'ingestion est un Job à part (ingestion.yaml), lancé à la demande.
apiVersion: v1
kind: Service
metadata:
  name: social
spec:
  # Publié sur le port 8080 du Mac par le load balancer de k3d (deploy/k3d/cluster.yaml)
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: social
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social
    spec:
      # Attend Postgres (premier démarrage : initialisation de la base) plutôt que d'échouer et redémarrer
      initContainers:
        - name: attente-postgres
          image: pgvector/pgvector:0.8.7-pg18
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U droits; do sleep 2; done"]
          resources:
            limits:
              memory: 64Mi
      containers:
        - name: social
          # Construite par ./mvnw spring-boot:build-image et importée dans k3d (pas de registre)
          image: social:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: social
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: mot-de-passe
            # Facultatif : seulement si le fournisseur est claude (jamais versionnée)
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: cle
                  optional: true
            # Calculateur de mémoire des buildpacks : moins de threads réservés pour tenir dans la limite
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
          # Sondes de Spring Boot, activées automatiquement sous Kubernetes
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          resources:
            requests:
              memory: 768Mi
              cpu: 250m
            limits:
              memory: 1Gi
