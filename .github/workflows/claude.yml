name: Claude

# Mention @claude dans une issue, une PR ou un commentaire de revue : Claude répond,
# implémente ou corrige. Ce workflow est lu depuis la branche par défaut (main).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Seuls le propriétaire et les collaborateurs du dépôt déclenchent Claude : sur un dépôt public,
    # n'importe qui peut commenter, et chaque appel est payant et dispose de droits d'écriture.
    # (claude-code-action vérifie aussi les droits de l'auteur, mais le job ne doit même pas démarrer.)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lecture des résultats du CI sur les PR
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Permet à Claude de compiler et lancer les tests (Testcontainers via le Docker du runner)
      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(./mvnw:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
