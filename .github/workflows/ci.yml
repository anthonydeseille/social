name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Affichage Markdown de la page web (JavaScript sans dépendance, Node fourni par le runner)
      - name: Tests JavaScript
        run: node src/test/js/markdown.test.js

      # verify = tests unitaires (surefire) + tests d'intégration *IT (failsafe, Testcontainers)
      - name: Build et tests
        run: ./mvnw -B -ntp verify

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rapports-tests
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  manifestes:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KUBECONFORM: v0.7.0
      # Somme publiée dans le fichier CHECKSUMS de la version
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - uses: actions/checkout@v5

      # Validation des manifestes de deploy/k8s contre les schémas de l'API Kubernetes (sans cluster)
      - name: kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          { kubectl kustomize deploy/k8s; echo '---'; cat deploy/k8s/ingestion.yaml; } \
            | ./kubeconform -strict -summary

  recherche:
    name: Évaluation de la recherche
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Sources épinglées (legi-data, kali-data) : téléchargées une fois par révision
      - name: Cache des sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/droits-corpus
          key: corpus-${{ hashFiles('src/main/resources/application.yaml') }}

      # Requêtes figées rejouées sur les vraies sources, sans appel au modèle ; échec si la recherche
      # retrouve moins d'articles attendus que la référence (src/test/resources/evaluation/)
      - name: Évaluation de la recherche
        run: >-
          ./mvnw -B -ntp verify -Dit.test=RechercheEvaluationIT -Dtest=Aucun -Dsurefire.failIfNoSpecifiedTests=false
          -Devaluation.recherche=true -Ddroits.ingestion.cache-dir=$HOME/.cache/droits-corpus

      - name: Rapport dans le résumé du job
        if: always()
        run: cat target/evaluation/recherche-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Rapport en artefact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: evaluation-recherche
          path: target/evaluation/
          retention-days: 30
