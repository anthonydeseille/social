name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Affichage Markdown de la page web (JavaScript sans dépendance, Node fourni par le runner)
      - name: Tests JavaScript
        run: node src/test/js/markdown.test.js

      # verify = tests unitaires (surefire) + tests d'intégration *IT (failsafe, Testcontainers)
      - name: Build et tests
        run: ./mvnw -B -ntp verify

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rapports-tests
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  manifestes:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KUBECONFORM: v0.7.0
      # Somme publiée dans le fichier CHECKSUMS de la version
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - uses: actions/checkout@v5

      # Validation des manifestes de deploy/k8s contre les schémas de l'API Kubernetes (sans cluster)
      - name: kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          { kubectl kustomize deploy/k8s; echo '---'; cat deploy/k8s/ingestion.yaml; } \
            | ./kubeconform -strict -summary
