spring:
  application:
    name: social
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    job:
      enabled: false
  mvc:
    problemdetails:
      enabled: true
  ai:
    model:
      # Spring AI ne configure Ollama que s'il est le fournisseur choisi
      chat: ${droits.assistant.fournisseur:claude}
      embedding: none
    chat:
      client:
        enabled: false
    ollama:
      # Adresse du serveur Ollama : la machine locale, ou une autre machine du réseau
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        # Contexte assez long pour quatre articles, le profil et la réponse (2048 jetons par défaut
        # dans Ollama, qui tronque sans prévenir) ; moins de mémoire qu'à 16 384
        num-ctx: 12288
        num-predict: 3072
        temperature: 0.2
    retry:
      # Un modèle local lent ne gagne rien à être relancé dix fois (défaut de Spring AI)
      max-attempts: 2
  http:
    clients:
      # Sur un processeur sans carte graphique, une rédaction peut prendre plusieurs minutes.
      # Propriété globale aux clients HTTP construits par Boot : seul Ollama en utilise un (Claude
      # passe par OkHttp, l'ingestion par le HttpClient du JDK, chacun avec son propre délai).
      read-timeout: 10m

# Seul /actuator/health est exposé par défaut. Les métriques (sans donnée personnelle, mais qui
# révèlent volume, coût et quota) s'ouvrent avec le profil « observabilite » : à ne pas activer sur
# un serveur public sans protection (port interne, authentification).
management:
  endpoints:
    web:
      exposure:
        include: health
  # Traces et métriques OpenTelemetry (OTLP) : export désactivé ici, activé par le profil
  # « observabilite » (adresse : OTEL_COLLECTEUR, deploy/k8s/observabilite.yaml). La clé des traces
  # est lue par OnEnabledTracingExportCondition (management.tracing.export.<exportateur>.enabled).
  tracing:
    sampling:
      # Peu de questions, chacune coûteuse : on les trace toutes
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

droits:
  assistant:
    # claude : API Anthropic (payante, citations natives) ; ollama : modèle local (gratuit, le
    # profil ne quitte pas la machine, réponses plus lentes et moins sûres)
    fournisseur: claude
  ingestion:
    base-url: https://raw.githubusercontent.com
    cache-dir: ${java.io.tmpdir}/droits-corpus
    sources:
      - cle: code
        type: CODE
        repo: SocialGouv/legi-data
        ref: c7bda6b6e389b901b889b316547b407f6f289b86
        fichier: data/LEGITEXT000006072050.json
      - cle: syntec
        type: CONVENTION_COLLECTIVE
        repo: SocialGouv/kali-data
        ref: 84b1d6713c20184f2fec889c69a056864f8c5246
        fichier: data/KALICONT000005635173.json
      # IDCC 3248 Métallurgie
      - cle: metallurgie
        type: CONVENTION_COLLECTIVE
        repo: SocialGouv/kali-data
        ref: 84b1d6713c20184f2fec889c69a056864f8c5246
        fichier: data/KALICONT000046993250.json
      # IDCC 2216 Commerce de détail et de gros à prédominance alimentaire
      - cle: commerce-alimentaire
        type: CONVENTION_COLLECTIVE
        repo: SocialGouv/kali-data
        ref: 84b1d6713c20184f2fec889c69a056864f8c5246
        fichier: data/KALICONT000005635085.json
      # IDCC 0016 Transports routiers et activités auxiliaires du transport
      - cle: transports-routiers
        type: CONVENTION_COLLECTIVE
        repo: SocialGouv/kali-data
        ref: 84b1d6713c20184f2fec889c69a056864f8c5246
        fichier: data/KALICONT000005635624.json
      # IDCC 1979 Hôtels, cafés, restaurants
      - cle: hotels-cafes-restaurants
        type: CONVENTION_COLLECTIVE
        repo: SocialGouv/kali-data
        ref: 84b1d6713c20184f2fec889c69a056864f8c5246
        fichier: data/KALICONT000005635534.json
      # IDCC 1090 Services de l'automobile
      - cle: services-automobile
        type: CONVENTION_COLLECTIVE
        repo: SocialGouv/kali-data
        ref: 84b1d6713c20184f2fec889c69a056864f8c5246
        fichier: data/KALICONT000005635191.json
      # IDCC 3043 Entreprises de propreté et services associés
      - cle: proprete
        type: CONVENTION_COLLECTIVE
        repo: SocialGouv/kali-data
        ref: 84b1d6713c20184f2fec889c69a056864f8c5246
        fichier: data/KALICONT000027172335.json

---
spring:
  config:
    activate:
      on-profile: observabilite
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Adresse OTLP de la pile d'observabilité (Grafana LGTM), à fournir par l'environnement :
  # OTEL_COLLECTEUR=http://hote:4318 (deploy/k8s/observabilite.yaml)
  tracing:
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTEUR:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_COLLECTEUR:http://localhost:4318}/v1/metrics
        step: 30s
