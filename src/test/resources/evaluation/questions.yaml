      - "dire que les heures de recherche d'emploi ne sont pas payées"

  - id: hcr-deces-pere
    theme: congés
    valide: false
    question: "Je travaille dans un hôtel et mon père vient de décéder. Combien de jours de congé ai-je, et suis-je payé ?"
    profil: {idcc: 1979, statut: NON_CADRE, typeContrat: CDI, dateEntree: 2022-04-01, dateReference: 2026-11-01}
    reponse_attendue: >
      3 jours : la convention des hôtels, cafés, restaurants ne prévoit que 1 jour pour le décès du père
      ou de la mère, mais le Code du travail fixe un minimum de 3 jours (ouvrables) pour le décès du père,
      de la mère, du conjoint, d'un frère ou d'une sœur ; la règle la plus favorable s'applique. Ces jours
      n'entraînent pas de réduction de la rémunération. Ils se prennent au moment de l'événement, sur
      justificatif.
    points_cles:
      - "3 jours, minimum du Code, plus favorable que le jour prévu par la convention"
      - "sans réduction de salaire"
      - "jours pris au moment de l'événement, sur justificatif"
    articles_attendus:
