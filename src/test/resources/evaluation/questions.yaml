  - id: temps-partiel-heures-complementaires
    theme: temps de travail
    valide: false
    question: "Je travaille à temps partiel (24 h par semaine) dans une entreprise Syntec. Mon employeur me demande des heures en plus : combien peut-il m'en demander et comment sont-elles payées ?"
    profil: {idcc: 1486, statut: NON_CADRE, typeContrat: CDI, tempsPartiel: true, dateEntree: 2024-01-08, dateReference: 2026-11-01}
    reponse_attendue: >
      Ce sont des heures complémentaires. Sans accord d'entreprise ou de branche étendu le permettant,
      l'employeur peut en demander au plus le dixième des heures du contrat, soit 2,4 h par semaine
      ici, chacune majorée de 10 %. Un accord d'entreprise ou un accord de branche étendu peut porter
      cette limite jusqu'au tiers (8 h) ; les heures entre le dixième et le tiers sont alors majorées
      de 25 %, sauf taux conventionnel (au moins 10 %). L'accord Syntec sur le temps partiel prévoit
      33 %, mais cet alinéa est exclu de l'extension. Les heures complémentaires ne peuvent jamais
      porter la durée du travail à 35 h.
    points_cles:
      - "sans accord, au plus le dixième des heures du contrat, soit 2,4 h par semaine"
      - "majoration de 10 % dans cette limite"
      - "jusqu'au tiers seulement si un accord d'entreprise ou de branche étendu le prévoit, avec 25 % au-delà du dixième sauf taux conventionnel"
      - "clause Syntec de 33 % exclue de l'extension"
      - "pas de durée portée à 35 h"
    articles_attendus:
      - {num: L3123-28, texte: CODE, sourceId: LEGIARTI000033019950}
      - {num: L3123-29, texte: CODE, sourceId: LEGIARTI000033019947}
      - {num: L3123-20, texte: CODE, sourceId: LEGIARTI000033019991}
      - {num: L3123-9, texte: CODE, sourceId: LEGIARTI000033020058}
      - {num: "Chapitre IX", texte: SYNTEC, sourceId: KALIARTI000005851652}
    erreurs_a_eviter:
      - "dire que l'employeur peut demander jusqu'au tiers des heures (8 h) sans accord"
      - "parler d'heures supplémentaires et de majorations de 25 % / 50 %"
      - "présenter la limite de 33 % comme applicable à tous les employeurs Syntec"
    remarques: >
      L'article Syntec du temps partiel n'a pas de numéro dans le dump (accord de 1999, chapitre IX).
      À valider : à défaut d'accord d'entreprise ou d'établissement, L3123-20 exige un accord de branche
      étendu ; la clause Syntec de 33 %, exclue de l'extension, peut-elle s'appliquer aux employeurs
      adhérents d'une organisation signataire ?

  - id: heures-supplementaires
    theme: temps de travail
    valide: false
    question: "Je suis technicien Syntec à 35 h. Cette semaine j'ai fait 45 heures à la demande de mon chef. Comment sont payées les heures en plus ?"
    profil: {idcc: 1486, statut: NON_CADRE, typeContrat: CDI, dateEntree: 2022-04-04, dateReference: 2026-11-01}
    reponse_attendue: >
      10 heures supplémentaires au-delà des 35 heures légales. Syntec renvoie aux majorations légales :
      à défaut d'accord, +25 % pour les 8 premières (de la 36e à la 43e heure) et +50 % au-delà (44e et
      45e). Un accord d'entreprise peut fixer un autre taux, sans descendre sous 10 %. Contingent Syntec
      ETAM : 130 heures supplémentaires par an.
    points_cles:
      - "10 heures supplémentaires"
      - "8 heures à +25 %, 2 heures à +50 % à défaut d'accord"
      - "un accord d'entreprise peut prévoir un taux différent, minimum 10 %"
