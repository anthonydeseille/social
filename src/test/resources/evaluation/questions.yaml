  - id: fin-cdd
    theme: CDD
    valide: false
    question: "Mon CDD se termine à la fin du mois et mon employeur ne me propose rien après. Ai-je droit à une prime ?"
    profil: {typeContrat: CDD, dateEntree: 2026-03-02, dateReference: 2026-11-01}
    reponse_attendue: >
      Oui : l'indemnité de fin de contrat (prime de précarité) est de 10 % de la rémunération totale
      brute versée, si la relation ne se poursuit pas en CDI. Elle n'est pas due notamment si le salarié
      refuse un CDI pour le même emploi ou un emploi similaire à rémunération au moins équivalente, en
      cas de rupture anticipée à son initiative, pour faute grave ou force majeure, pour certains
      contrats (saisonniers, vacances scolaires des jeunes).
    points_cles:
      - "10 % de la rémunération totale brute"
      - "due si le contrat ne se poursuit pas en CDI"
      - "exclusions : refus d'un CDI équivalent, rupture anticipée par le salarié, faute grave..."
      - "convention non renseignée : elle peut prévoir des règles particulières"
    articles_attendus:
      - {num: L1243-8, texte: CODE, sourceId: LEGIARTI000006901219}
      - {num: L1243-10, texte: CODE, sourceId: LEGIARTI000006901221}

  - id: handicap-preavis
    theme: préavis
    valide: false
    question: "Je suis reconnu travailleur handicapé, ETAM chez un employeur Syntec depuis 3 ans, et je suis licencié. Mon préavis est-il plus long ?"
    profil: {idcc: 1486, statut: NON_CADRE, typeContrat: CDI, dateEntree: 2023-10-01, situations: [TRAVAILLEUR_HANDICAPE], dateReference: 2026-11-01}
    reponse_attendue: >
      Oui : le préavis de licenciement est doublé pour un travailleur handicapé, dans la limite de 3 mois.
      Le préavis normal serait de 2 mois (Code et Syntec, plus de 2 ans d'ancienneté), soit 4 mois
      doublé, ramené au plafond de 3 mois. Le doublement ne joue pas si la convention prévoit déjà au
      moins 3 mois, ce qui n'est pas le cas pour un ETAM Syntec (mais l'est pour un cadre).
    points_cles:
      - "préavis doublé, plafonné à 3 mois"
      - "ici 2 mois doublés, ramenés à 3 mois"
      - "pas de doublement si la convention prévoit déjà au moins 3 mois"
    articles_attendus:
      - {num: L5213-9, texte: CODE, sourceId: LEGIARTI000006903707}
      - {num: L1234-1, texte: CODE, sourceId: LEGIARTI000006901112}
      - {num: "4.2", texte: SYNTEC, sourceId: KALIARTI000047513833}
    erreurs_a_eviter:
      - "annoncer 4 mois de préavis"

