    valide: false
    question: "Je suis serveur dans un restaurant depuis un an, en CDI, et mon patron me licencie (pas pour faute). Combien de temps dure mon préavis, et puis-je m'absenter pour chercher un travail ?"
    profil: {idcc: 1979, statut: NON_CADRE, typeContrat: CDI, dateEntree: 2025-10-01, classification: "employé", dateReference: 2026-11-01}
    reponse_attendue: >
      1 mois : la convention des hôtels, cafés, restaurants fixe le préavis de licenciement d'un employé
      ayant de 6 mois à moins de 2 ans d'ancienneté à 1 mois, comme le Code du travail. Pendant le préavis,
      un salarié à temps complet peut s'absenter pour chercher un emploi 2 heures par jour de travail, au
      plus la durée hebdomadaire de travail, sans réduction de salaire ; les heures sont fixées d'un commun
      accord ou alternativement un jour par l'employeur, un jour par le salarié, en dehors des services des
      repas. Le droit cesse s'il trouve un emploi.
    points_cles:
      - "1 mois de préavis (employé, 6 mois à moins de 2 ans d'ancienneté)"
      - "2 heures par jour de travail pour chercher un emploi, au plus la durée hebdomadaire de travail"
      - "ces absences ne réduisent pas le salaire en cas de licenciement"
